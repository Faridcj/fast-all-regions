name: Generate EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"

permissions:
  contents: write

jobs:
  epg:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip


      - name: Download EPG sources
        run: |

          mkdir -p epg_sources

          cat > download_epg.py <<'PY'

          import gzip
          import urllib.request
          from pathlib import Path


          USER_AGENT = (
              "Mozilla/5.0 "
              "(compatible; FAST-EPG/4.0)"
          )


          SOURCES = {

              "samsung": [
                  "https://raw.githubusercontent.com/"
                  "BuddyChewChew/samsungtvplus/main/"
                  "output/samsung_tvplus.xml",
              ],

              "lg": [
                  "https://raw.githubusercontent.com/"
                  "BuddyChewChew/lg-playlist-generator/main/"
                  "lg_channels_us.xml",
              ],

              "tcl": [
                  "https://raw.githubusercontent.com/"
                  "BuddyChewChew/tcl-playlist-generator/main/"
                  "tcl_epg.xml",
              ],

              "rakuten": [
                  "https://raw.githubusercontent.com/"
                  "BuddyChewChew/RakutenTV/main/"
                  "epg.xml",
              ],

              "airy": [
                  "https://raw.githubusercontent.com/"
                  "BuddyChewChew/airy-playlist-generator/main/"
                  "airy_channels.xml",
              ],

              "pluto": [
                  "https://raw.githubusercontent.com/"
                  "matthuisman/i.mjh.nz/refs/heads/master/"
                  "PlutoTV/all.xml.gz",

                  "https://raw.githubusercontent.com/"
                  "matthuisman/i.mjh.nz/refs/heads/master/"
                  "PlutoTV/all.xml",
              ],

              "plex": [
                  "https://raw.githubusercontent.com/"
                  "matthuisman/i.mjh.nz/refs/heads/master/"
                  "Plex/all.xml.gz",

                  "https://raw.githubusercontent.com/"
                  "matthuisman/i.mjh.nz/refs/heads/master/"
                  "Plex/all.xml",
              ],

              "xumo": [
                  "https://raw.githubusercontent.com/"
                  "BuddyChewChew/xumo-playlist-generator/main/"
                  "xumo_epg.xml.gz",

                  "https://raw.githubusercontent.com/"
                  "BuddyChewChew/xumo-playlist-generator/main/"
                  "xumo_epg.xml",
              ],

              "tubi": [
                  "https://raw.githubusercontent.com/"
                  "BuddyChewChew/tubi-scraper/main/"
                  "tubi_epg.xml",
              ],
          }


          def download(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept": "*/*",
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=120,
              ) as response:

                  return response.read()


          for name, urls in SOURCES.items():

              success = False

              for index, url in enumerate(urls):

                  print("")
                  print("=" * 70)
                  print("SOURCE:", name)
                  print("URL:", url)
                  print("=" * 70)

                  try:

                      data = download(url)

                      # Validate gzip if necessary
                      if data[:2] == b"\x1f\x8b":

                          print("Detected gzip")

                          # Keep XML uncompressed
                          data = gzip.decompress(
                              data
                          )

                      # Basic XMLTV validation
                      if (
                          b"<tv" not in data[:5000]
                          and
                          b"<channel" not in data[:5000]
                      ):

                          raise RuntimeError(
                              "Downloaded file does not "
                              "look like XMLTV"
                          )

                      output = (
                          Path("epg_sources")
                          / f"{name}.xml"
                      )

                      output.write_bytes(data)

                      print(
                          "Downloaded:",
                          output
                      )

                      print(
                          "Size:",
                          len(data),
                          "bytes"
                      )

                      success = True
                      break

                  except Exception as exc:

                      print(
                          "FAILED:",
                          exc
                      )

              if not success:

                  print(
                      "WARNING:",
                      name,
                      "could not be downloaded"
                  )

          PY

          python download_epg.py


      - name: Build combined XMLTV
        run: |

          cat > combine_epg.py <<'PY'

          import xml.etree.ElementTree as ET
          from pathlib import Path


          SOURCE_DIR = Path(
              "epg_sources"
          )

          OUTPUT = Path(
              "epg.xml"
          )


          root = ET.Element("tv")


          seen_channels = set()

          total_channels = 0
          total_programmes = 0

          successful_sources = 0


          for file in sorted(
              SOURCE_DIR.glob("*.xml")
          ):

              print("")
              print("=" * 70)
              print("PROCESSING:", file)
              print("=" * 70)

              try:

                  tree = ET.parse(file)

                  source_root = (
                      tree.getroot()
                  )

                  source_channels = 0
                  source_programmes = 0


                  # ----------------------------------------
                  # Channels
                  # ----------------------------------------

                  for channel in source_root.findall(
                      ".//channel"
                  ):

                      channel_id = (
                          channel.get("id")
                      )

                      if not channel_id:
                          continue

                      if channel_id in seen_channels:
                          continue

                      seen_channels.add(
                          channel_id
                      )

                      root.append(
                          channel
                      )

                      source_channels += 1
                      total_channels += 1


                  # ----------------------------------------
                  # Programmes
                  # ----------------------------------------

                  for programme in source_root.findall(
                      ".//programme"
                  ):

                      root.append(
                          programme
                      )

                      source_programmes += 1
                      total_programmes += 1


                  successful_sources += 1


                  print(
                      "Channels:",
                      source_channels
                  )

                  print(
                      "Programmes:",
                      source_programmes
                  )

              except Exception as exc:

                  print(
                      "ERROR:",
                      exc
                  )


          # --------------------------------------------
          # XML declaration
          # --------------------------------------------

          tree = ET.ElementTree(
              root
          )

          tree.write(
              OUTPUT,
              encoding="utf-8",
              xml_declaration=True
          )


          print("")
          print("=" * 70)
          print("FINAL EPG")
          print("=" * 70)

          print(
              "Sources:",
              successful_sources
          )

          print(
              "Channels:",
              total_channels
          )

          print(
              "Programmes:",
              total_programmes
          )

          print(
              "Output:",
              OUTPUT
          )

          print(
              "Size:",
              OUTPUT.stat().st_size,
              "bytes"
          )

          PY

          python combine_epg.py


      - name: Validate EPG
        run: |

          python - <<'PY'

          import xml.etree.ElementTree as ET

          file = "epg.xml"

          tree = ET.parse(file)

          root = tree.getroot()

          channels = root.findall(
              ".//channel"
          )

          programmes = root.findall(
              ".//programme"
          )

          print("")
          print("=" * 70)
          print("EPG VALIDATION")
          print("=" * 70)

          print(
              "Root:",
              root.tag
          )

          print(
              "Channels:",
              len(channels)
          )

          print(
              "Programmes:",
              len(programmes)
          )

          if root.tag != "tv":
              raise SystemExit(
                  "Invalid XMLTV root"
              )

          if not channels:
              raise SystemExit(
                  "No channels found"
              )

          if not programmes:
              print(
                  "WARNING: No programmes found"
              )

          print(
              "EPG XML VALID"
          )

          PY


      - name: Run EPG audit
        run: |

          python scripts/epg_audit.py


      - name: Upload EPG XML
        uses: actions/upload-artifact@v4
        with:
          name: epg-xml
          path: epg.xml
          if-no-files-found: error


      - name: Upload EPG audit report
        uses: actions/upload-artifact@v4
        with:
          name: epg-audit-report
          path: epg-audit.txt
          if-no-files-found: error
