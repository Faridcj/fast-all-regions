name: Merge M3U + EPG

on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Download EPG artifact from previous run
      # --------------------------------------------------
      - name: Download EPG artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p epg_artifact

          gh run download 31958511043 \
            --repo Faridcj/fast-all-regions \
            --dir epg_artifact

          echo ""
          echo "======================================"
          echo "ARTIFACT FILES"
          echo "======================================"

          find epg_artifact -type f -print


      # --------------------------------------------------
      # 3. Inspect artifact files
      # --------------------------------------------------
      - name: Inspect artifact
        run: |
          echo ""
          echo "======================================"
          echo "FILE TYPES"
          echo "======================================"

          find epg_artifact -type f -exec file {} \;

          echo ""
          echo "======================================"
          echo "FILE CONTENT PREVIEW"
          echo "======================================"

          while IFS= read -r file; do

            echo ""
            echo "--------------------------------------"
            echo "FILE: $file"
            echo "--------------------------------------"

            head -c 300 "$file" | cat -v

            echo ""

          done < <(find epg_artifact -type f)


      # --------------------------------------------------
      # 4. Find actual XMLTV EPG file
      # --------------------------------------------------
      - name: Find EPG XML
        run: |
          EPG_FILE=""

          while IFS= read -r file; do

            echo "Checking: $file"

            # Check normal XMLTV
            if head -c 1000 "$file" 2>/dev/null | grep -qiE '<tv[ >]|<channel[ >]|<programme[ >]'; then
              EPG_FILE="$file"
              break
            fi

            # Check gzip compressed XMLTV
            if file "$file" | grep -qi gzip; then

              if gzip -cd "$file" 2>/dev/null | head -c 1000 | grep -qiE '<tv[ >]|<channel[ >]|<programme[ >]'; then
                EPG_FILE="$file"
                break
              fi

            fi

          done < <(find epg_artifact -type f)


          if [ -z "$EPG_FILE" ]; then
            echo ""
            echo "======================================"
            echo "ERROR: EPG XML FILE NOT FOUND"
            echo "======================================"
            exit 1
          fi


          echo ""
          echo "======================================"
          echo "EPG FOUND"
          echo "======================================"

          echo "$EPG_FILE"

          echo "EPG_FILE=$EPG_FILE" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 5. Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # --------------------------------------------------
      # 6. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests


      # --------------------------------------------------
      # 7. Create merge script
      # --------------------------------------------------
      - name: Create merge script
        run: |

          cat > merge_epg.py <<'PY'

          import os
          import gzip
          import re
          import requests
          import xml.etree.ElementTree as ET
          from pathlib import Path


          # --------------------------------------------------
          # SOURCE M3U
          # --------------------------------------------------

          M3U_URL = (
              "https://raw.githubusercontent.com/"
              "Faridcj/fast-all-regions/main/"
              "fast-all-regions.m3u"
          )


          # --------------------------------------------------
          # FILES
          # --------------------------------------------------

          EPG_FILE = Path(os.environ["EPG_FILE"])

          OUTPUT = Path("fast-all-regions-epg.m3u")


          # --------------------------------------------------
          # Normalize channel names
          # --------------------------------------------------

          def normalize(text):

              if not text:
                  return ""

              text = text.lower()

              # Remove common separators
              text = re.sub(
                  r"[\s_\-\.]+",
                  "",
                  text
              )

              # Keep letters/numbers
              text = re.sub(
                  r"[^a-z0-9]+",
                  "",
                  text
              )

              return text


          # --------------------------------------------------
          # Read EPG
          # --------------------------------------------------

          def load_epg(path):

              print("Reading EPG:", path)

              data = path.read_bytes()


              # Detect gzip
              if data[:2] == b"\x1f\x8b":

                  print("EPG is gzip compressed")

                  data = gzip.decompress(data)


              print(
                  "EPG size:",
                  len(data),
                  "bytes"
              )


              # Parse XML
              root = ET.fromstring(data)


              epg = {}


              # XMLTV channels
              for channel in root.findall(".//channel"):

                  channel_id = channel.get("id")

                  if not channel_id:
                      continue


                  # Every display-name can be useful
                  for name in channel.findall("display-name"):

                      if not name.text:
                          continue

                      normalized = normalize(
                          name.text
                      )

                      if normalized:

                          epg[normalized] = channel_id


              return epg


          # --------------------------------------------------
          # Find matching EPG ID
          # --------------------------------------------------

          def find_epg_id(
              channel_name,
              epg
          ):

              normalized_name = normalize(
                  channel_name
              )


              if not normalized_name:
                  return None


              # Exact match
              if normalized_name in epg:

                  return epg[
                      normalized_name
                  ]


              # Partial match
              for epg_name, epg_id in epg.items():

                  if (
                      normalized_name in epg_name
                      or
                      epg_name in normalized_name
                  ):

                      return epg_id


              return None


          # --------------------------------------------------
          # Download M3U
          # --------------------------------------------------

          print("")
          print("======================================")
          print("DOWNLOADING M3U")
          print("======================================")


          response = requests.get(
              M3U_URL,
              timeout=120
          )

          response.raise_for_status()


          m3u = response.text


          print(
              "M3U size:",
              len(m3u),
              "characters"
          )


          # --------------------------------------------------
          # Load EPG
          # --------------------------------------------------

          print("")
          print("======================================")
          print("LOADING EPG")
          print("======================================")


          epg = load_epg(
              EPG_FILE
          )


          print(
              "EPG names:",
              len(epg)
          )


          # --------------------------------------------------
          # Merge
          # --------------------------------------------------

          print("")
          print("======================================")
          print("MERGING")
          print("======================================")


          lines = m3u.splitlines()

          output = []

          total_channels = 0
          matched_channels = 0


          for line in lines:


              if line.startswith(
                  "#EXTINF"
              ):

                  total_channels += 1


                  # Extract channel name
                  if "," in line:

                      channel_name = (
                          line.split(
                              ",",
                              1
                          )[1].strip()
                      )

                  else:

                      channel_name = ""


                  # Find EPG
                  epg_id = find_epg_id(
                      channel_name,
                      epg
                  )


                  if epg_id:


                      # Existing tvg-id
                      if 'tvg-id="' in line:

                          line = re.sub(
                              r'tvg-id="[^"]*"',
                              f'tvg-id="{epg_id}"',
                              line
                          )


                      # No tvg-id
                      else:

                          line = line.replace(
                              "#EXTINF:",
                              f'#EXTINF: tvg-id="{epg_id}"',
                              1
                          )


                      matched_channels += 1


                  output.append(
                      line
                  )


              else:

                  output.append(
                      line
                  )


          # --------------------------------------------------
          # Write output
          # --------------------------------------------------

          OUTPUT.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )


          # --------------------------------------------------
          # Statistics
          # --------------------------------------------------

          print("")
          print("======================================")
          print("RESULT")
          print("======================================")

          print(
              "Total channels:",
              total_channels
          )

          print(
              "EPG matched:",
              matched_channels
          )

          print(
              "EPG unmatched:",
              total_channels -
              matched_channels
          )
