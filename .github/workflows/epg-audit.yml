name: EPG Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run EPG audit
        run: |
          python scripts/epg_audit.py

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: epg-audit-report
          path: epg-audit.txt
