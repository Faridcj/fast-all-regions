name: Generate Optimized EPG

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "Update FAST All Regions"
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: generate-optimized-epg
  cancel-in-progress: false

jobs:
  epg:

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.name == 'Update FAST All Regions'
      )

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==================================================
      # 2. Setup Python
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==================================================
      # 3. Download EPG sources
      # ==================================================

      - name: Download EPG sources
        run: |

          mkdir -p epg_sources

          cat > download_epg.py <<'PY'

          import gzip
          import urllib.request
          from pathlib import Path


          USER_AGENT = (
              "Mozilla/5.0 "
              "(compatible; FAST-EPG/5.0)"
          )


          SOURCES = {

              "samsung": [
                  "https://raw.githubusercontent.com/"
                  "BuddyChewChew/samsungtvplus/main/"
                  "output/samsung_tvplus.xml",
              ],

              "lg": [
                  "https://raw.githubusercontent.com/"
                  "BuddyChewChew/lg-playlist-generator/main/"
                  "lg_channels_us.xml",
              ],

              "tcl": [
                  "https://raw.githubusercontent.com/"
                  "BuddyChewChew/tcl-playlist-generator/main/"
                  "tcl_epg.xml",
              ],

              "rakuten": [
                  "https://raw.githubusercontent.com/"
                  "BuddyChewChew/RakutenTV/main/"
                  "epg.xml",
              ],

              "airy": [
                  "https://raw.githubusercontent.com/"
                  "BuddyChewChew/airy-playlist-generator/main/"
                  "airy_channels.xml",
              ],

              "pluto": [
                  "https://raw.githubusercontent.com/"
                  "matthuisman/i.mjh.nz/refs/heads/master/"
                  "PlutoTV/all.xml.gz",

                  "https://raw.githubusercontent.com/"
                  "matthuisman/i.mjh.nz/refs/heads/master/"
                  "PlutoTV/all.xml",
              ],

              "plex": [
                  "https://raw.githubusercontent.com/"
                  "matthuisman/i.mjh.nz/refs/heads/master/"
                  "Plex/all.xml.gz",

                  "https://raw.githubusercontent.com/"
                  "matthuisman/i.mjh.nz/refs/heads/master/"
                  "Plex/all.xml",
              ],

              "xumo": [
                  "https://raw.githubusercontent.com/"
                  "BuddyChewChew/xumo-playlist-generator/main/"
                  "xumo_epg.xml.gz",

                  "https://raw.githubusercontent.com/"
                  "BuddyChewChew/xumo-playlist-generator/main/"
                  "xumo_epg.xml",
              ],

              "tubi": [
                  "https://raw.githubusercontent.com/"
                  "BuddyChewChew/tubi-scraper/main/"
                  "tubi_epg.xml",
              ],
          }


          def download(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept": "*/*",
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=120
              ) as response:

                  return response.read()


          for name, urls in SOURCES.items():

              success = False

              for url in urls:

                  print("")
                  print("=" * 70)
                  print("SOURCE:", name)
                  print("URL:", url)
                  print("=" * 70)

                  try:

                      data = download(url)

                      if data[:2] == b"\x1f\x8b":

                          print("Detected gzip")

                          data = gzip.decompress(data)


                      preview = data[:10000]

                      if (
                          b"<tv" not in preview
                          and
                          b"<channel" not in preview
                      ):

                          raise RuntimeError(
                              "Not XMLTV"
                          )


                      output = (
                          Path("epg_sources")
                          / f"{name}.xml"
                      )

                      output.write_bytes(
                          data
                      )


                      print(
                          "Downloaded:",
                          output
                      )

                      print(
                          "Size:",
                          len(data),
                          "bytes"
                      )

                      success = True
                      break


                  except Exception as exc:

                      print(
                          "FAILED:",
                          exc
                      )


              if not success:

                  print(
                      "WARNING:",
                      name,
                      "failed"
                  )

          PY

          python download_epg.py


      # ==================================================
      # 4. Build optimized EPG
      # ==================================================

      - name: Build optimized EPG
        run: |

          cat > optimize_epg.py <<'PY'

          import gzip
          import re
          import xml.etree.ElementTree as ET

          from datetime import datetime
          from datetime import timedelta
          from datetime import timezone

          from pathlib import Path


          M3U_FILE = Path(
              "fast-all-regions.m3u"
          )

          SOURCE_DIR = Path(
              "epg_sources"
          )

          OUTPUT = Path(
              "epg.xml"
          )

          GZIP_OUTPUT = Path(
              "epg.xml.gz"
          )


          def normalize(text):

              if not text:
                  return ""

              return re.sub(
                  r"[^a-zA-Z0-9]+",
                  "",
                  text.lower()
              )


          def parse_time(value):

              if not value:
                  return None

              try:

                  value = value.strip()

                  match = re.match(
                      r"^(\d{14})\s*([+-]\d{4})?",
                      value
                  )

                  if not match:
                      return None

                  dt = datetime.strptime(
                      match.group(1),
                      "%Y%m%d%H%M%S"
                  )

                  offset = match.group(2)

                  if offset:

                      sign = (
                          1
                          if offset[0] == "+"
                          else -1
                      )

                      hours = int(
                          offset[1:3]
                      )

                      minutes = int(
                          offset[3:5]
                      )

                      tz = timezone(
                          sign * timedelta(
                              hours=hours,
                              minutes=minutes
                          )
                      )

                      dt = dt.replace(
                          tzinfo=tz
                      )

                  else:

                      dt = dt.replace(
                          tzinfo=timezone.utc
                      )

                  return dt

              except Exception:

                  return None


          # ==================================================
          # Read M3U
          # ==================================================

          print("=" * 70)
          print("READING M3U")
          print("=" * 70)


          if not M3U_FILE.exists():

              raise SystemExit(
                  "ERROR: fast-all-regions.m3u not found"
              )


          m3u_text = M3U_FILE.read_text(
              encoding="utf-8",
              errors="ignore"
          )


          wanted_ids = set()
          wanted_names = set()


          for line in m3u_text.splitlines():

              if not line.startswith("#EXTINF"):
                  continue


              match = re.search(
                  r'tvg-id="([^"]+)"',
                  line,
                  re.I
              )


              if match:

                  value = match.group(1).strip()

                  if value:

                      wanted_ids.add(value)


              if "," in line:

                  name = line.split(
                      ",",
                      1
                  )[1].strip()

                  normalized = normalize(
                      name
                  )

                  if normalized:

                      wanted_names.add(
                          normalized
                      )


          print(
              "M3U tvg-id:",
              len(wanted_ids)
          )

          print(
              "M3U names:",
              len(wanted_names)
          )


          # ==================================================
          # Date window
          # ==================================================

          now = datetime.now(
              timezone.utc
          )


          minimum_time = (
              now -
              timedelta(days=7)
          )


          maximum_time = (
              now +
              timedelta(days=14)
          )


          # ==================================================
          # XML root
          # ==================================================

          root = ET.Element(
              "tv"
          )


          seen_channels = set()
          seen_programmes = set()


          matched_channels = 0
          kept_programmes = 0
          duplicate_programmes = 0
          old_programmes = 0
          future_programmes = 0


          # ==================================================
          # Process sources
          # ==================================================

          for file in sorted(
              SOURCE_DIR.glob("*.xml")
          ):

              print("")
              print("=" * 70)
              print(
                  "PROCESSING:",
                  file
              )
              print("=" * 70)


              try:

                  tree = ET.parse(
                      file
                  )

                  source_root = (
                      tree.getroot()
                  )

              except Exception as exc:

                  print(
                      "SKIPPED:",
                      exc
                  )

                  continue


              matching_ids = set()


              # ------------------------------------------------
              # Channels
              # ------------------------------------------------

              for channel in source_root.findall(
                  ".//channel"
              ):

                  cid = channel.get(
                      "id"
                  )


                  if not cid:
                      continue


                  names = []


                  for display in channel.findall(
                      "display-name"
                  ):

                      if display.text:

                          names.append(
                              normalize(
                                  display.text
                              )
                          )


                  matched = False


                  if cid in wanted_ids:

                      matched = True


                  if (
                      not matched
                      and
                      set(names) &
                      wanted_names
                  ):

                      matched = True


                  if not matched:

                      continue


                  matching_ids.add(
                      cid
                  )


                  if cid in seen_channels:

                      continue


                  seen_channels.add(
                      cid
                  )


                  new_channel = ET.Element(
                      "channel",
                      {
                          "id": cid
                      }
                  )


                  display = (
                      channel.find(
                          "display-name"
                      )
                  )


                  if (
                      display is not None
                      and
                      display.text
                  ):

                      d = ET.SubElement(
                          new_channel,
                          "display-name"
                      )

                      d.text = (
                          display.text.strip()
                      )


                  root.append(
                      new_channel
                  )


                  matched_channels += 1


              # ------------------------------------------------
              # Programmes
              # ------------------------------------------------

              for programme in source_root.findall(
                  ".//programme"
              ):

                  cid = programme.get(
                      "channel"
                  )


                  if cid not in matching_ids:

                      continue


                  start_raw = programme.get(
                      "start"
                  )


                  stop_raw = programme.get(
                      "stop"
                  )


                  start = parse_time(
                      start_raw
                  )


                  if start is None:

                      continue


                  if start < minimum_time:

                      old_programmes += 1

                      continue


                  if start > maximum_time:

                      future_programmes += 1

                      continue


                  title = programme.find(
                      "title"
                  )


                  if (
                      title is None
                      or
                      not title.text
                  ):

                      continue


                  title_text = (
                      title.text.strip()
                  )


                  if not title_text:

                      continue


                  duplicate_key = (
                      cid,
                      start_raw,
                      stop_raw,
                      title_text
                  )


                  if (
                      duplicate_key
                      in
                      seen_programmes
                  ):

                      duplicate_programmes += 1

                      continue


                  seen_programmes.add(
                      duplicate_key
                  )


                  attrs = {
                      "channel": cid,
                      "start": start_raw
                  }


                  if stop_raw:

                      attrs["stop"] = stop_raw


                  new_programme = ET.Element(
                      "programme",
                      attrs
                  )


                  new_title = ET.SubElement(
                      new_programme,
                      "title"
                  )


                  new_title.text = (
                      title_text
                  )


                  root.append(
                      new_programme
                  )


                  kept_programmes += 1


          # ==================================================
          # Write XML
          # ==================================================

          print("")
          print("=" * 70)
          print("WRITING OPTIMIZED EPG")
          print("=" * 70)


          tree = ET.ElementTree(
              root
          )


          tree.write(
              OUTPUT,
              encoding="utf-8",
              xml_declaration=True
          )


          # ==================================================
          # GZIP
          # ==================================================

          with open(
              OUTPUT,
              "rb"
          ) as source:

              with gzip.open(
                  GZIP_OUTPUT,
                  "wb",
                  compresslevel=9
              ) as target:

                  target.write(
                      source.read()
                  )


          xml_size = (
              OUTPUT.stat().st_size
              / 1024
              / 1024
          )


          gzip_size = (
              GZIP_OUTPUT.stat().st_size
              / 1024
              / 1024
          )


          print("")
          print("=" * 70)
          print("FINAL RESULT")
          print("=" * 70)


          print(
              "Channels:",
              matched_channels
          )


          print(
              "Programmes:",
              kept_programmes
          )


          print(
              "Duplicates removed:",
              duplicate_programmes
          )


          print(
              "Old removed:",
              old_programmes
          )


          print(
              "Future removed:",
              future_programmes
          )


          print(
              "XML:",
              round(
                  xml_size,
                  2
              ),
              "MB"
          )


          print(
              "GZIP:",
              round(
                  gzip_size,
                  2
              ),
              "MB"
          )

          PY

          python optimize_epg.py


      # ==================================================
      # 5. Validate EPG
      # ==================================================

      - name: Validate EPG
        run: |

          python - <<'PY'

          import xml.etree.ElementTree as ET


          file = "epg.xml"


          tree = ET.parse(
              file
          )


          root = tree.getroot()


          channels = root.findall(
              ".//channel"
          )


          programmes = root.findall(
              ".//programme"
          )


          print("")
          print("=" * 70)
          print("EPG VALIDATION")
          print("=" * 70)


          print(
              "Root:",
              root.tag
          )


          print(
              "Channels:",
              len(channels)
          )


          print(
              "Programmes:",
              len(programmes)
          )


          if root.tag != "tv":

              raise SystemExit(
                  "INVALID XMLTV ROOT"
              )


          if not channels:

              raise SystemExit(
                  "NO CHANNELS FOUND"
              )


          if not programmes:

              raise SystemExit(
                  "NO PROGRAMMES FOUND"
              )


          print(
              "EPG XML VALID"
          )

          PY


      # ==================================================
      # 6. Create EPG audit report
      # ==================================================

      - name: Create EPG audit report
        run: |

          python - <<'PY'

          import xml.etree.ElementTree as ET

          from pathlib import Path


          file = Path(
              "epg.xml"
          )


          tree = ET.parse(
              file
          )


          root = tree.getroot()


          channels = root.findall(
              ".//channel"
          )


          programmes = root.findall(
              ".//programme"
          )


          lines = []


          lines.append(
              "EPG AUDIT REPORT"
          )


          lines.append(
              "=" * 60
          )


          lines.append(
              f"Channels: {len(channels)}"
          )


          lines.append(
              f"Programmes: {len(programmes)}"
          )


          lines.append(
              f"EPG XML size: {file.stat().st_size} bytes"
          )


          if root.tag != "tv":

              raise SystemExit(
                  "Invalid XMLTV root"
              )


          if not channels:

              raise SystemExit(
                  "No channels found"
              )


          if not programmes:

              raise SystemExit(
                  "No programmes found"
              )


          lines.append(
              "Status: VALID"
          )


          Path(
              "epg-audit.txt"
          ).write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )


          print(
              "\n".join(lines)
          )

          PY


      # ==================================================
      # 7. Publish EPG
      # ==================================================

      - name: Publish EPG XML
        run: |

          mkdir -p public


          cp \
            epg.xml \
            public/epg.xml


          git config user.name \
            "github-actions[bot]"


          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            public/epg.xml


          if git diff --cached --quiet; then

            echo "No EPG changes."

          else

            git commit \
              -m "Update EPG XML"


            git fetch origin main


            git rebase origin/main


            git push origin HEAD:main

          fi


      # ==================================================
      # 8. Upload EPG XML
      # ==================================================

      - name: Upload EPG XML
        uses: actions/upload-artifact@v4

        with:
          name: epg-xml
          path: epg.xml
          if-no-files-found: error


      # ==================================================
      # 9. Upload compressed EPG
      # ==================================================

      - name: Upload compressed EPG
        uses: actions/upload-artifact@v4

        with:
          name: epg-xml-gz
          path: epg.xml.gz
          if-no-files-found: error


      # ==================================================
      # 10. Upload audit report
      # ==================================================

      - name: Upload EPG audit
        uses: actions/upload-artifact@v4

        with:
          name: epg-audit-report
          path: epg-audit.txt
          if-no-files-found: error
