name: Build Final M3U

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - Generate Optimized EPG
    types:
      - completed

permissions:
  contents: write

jobs:

  merge:

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:

      # ================================================
      # Checkout
      # ================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ================================================
      # Download latest EPG artifact
      # ================================================

      - name: Download EPG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          mkdir -p epg_artifact

          if [ "${{ github.event_name }}" = "workflow_run" ]; then

            RUN_ID="${{ github.event.workflow_run.id }}"

          else

            RUN_ID=$(gh run list \
              --workflow "epg-audit.yml" \
              --repo "${{ github.repository }}" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')

          fi


          echo "EPG RUN ID: $RUN_ID"


          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name epg-xml-gz \
            --dir epg_artifact


          echo ""
          echo "EPG ARTIFACT:"
          find epg_artifact -type f -ls


      # ================================================
      # Extract EPG
      # ================================================

      - name: Extract EPG
        run: |

          GZ_FILE=$(find epg_artifact \
            -type f \
            -name "*.gz" \
            | head -n 1)


          if [ -z "$GZ_FILE" ]; then

            echo "ERROR: EPG gzip not found"

            exit 1

          fi


          echo "Using:"
          echo "$GZ_FILE"


          gzip -dc "$GZ_FILE" > epg.xml


          ls -lh epg.xml


      # ================================================
      # Setup Python
      # ================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ================================================
      # Build final M3U
      # ================================================

      - name: Merge M3U + EPG
        run: |

          cat > merge_epg.py <<'PY'

          import re
          import xml.etree.ElementTree as ET

          from pathlib import Path


          M3U_URL = (
              "https://raw.githubusercontent.com/"
              "Faridcj/fast-all-regions/main/"
              "fast-all-regions.m3u"
          )


          EPG_FILE = Path(
              "epg.xml"
          )


          OUTPUT = Path(
              "fast-all-regions-epg.m3u"
          )


          # ==================================================
          # Download M3U
          # ==================================================

          import urllib.request


          print("=" * 70)
          print("DOWNLOADING M3U")
          print("=" * 70)


          request = urllib.request.Request(
              M3U_URL,
              headers={
                  "User-Agent":
                  "Mozilla/5.0"
              }
          )


          with urllib.request.urlopen(
              request,
              timeout=120
          ) as response:

              m3u = response.read().decode(
                  "utf-8",
                  errors="ignore"
              )


          print(
              "M3U size:",
              len(m3u)
          )


          # ==================================================
          # Load EPG
          # ==================================================

          print("")
          print("=" * 70)
          print("LOADING EPG")
          print("=" * 70)


          tree = ET.parse(
              EPG_FILE
          )


          root = tree.getroot()


          epg_ids = set()


          epg_names = {}


          for channel in root.findall(
              ".//channel"
          ):

              cid = channel.get(
                  "id"
              )


              if not cid:
                  continue


              epg_ids.add(
                  cid
              )


              for display in channel.findall(
                  "display-name"
              ):

                  if not display.text:
                      continue


                  name = re.sub(
                      r"[^a-zA-Z0-9]+",
                      "",
                      display.text.lower()
                  )


                  if name:

                      epg_names[
                          name
                      ] = cid


          print(
              "EPG IDs:",
              len(epg_ids)
          )


          print(
              "EPG names:",
              len(epg_names)
          )


          # ==================================================
          # Helpers
          # ==================================================

          def normalize(text):

              if not text:

                  return ""

              return re.sub(
                  r"[^a-zA-Z0-9]+",
                  "",
                  text.lower()
              )


          def find_epg_id(
              tvg_id,
              channel_name
          ):

              # ----------------------------------------------
              # Exact tvg-id
              # ----------------------------------------------

              if tvg_id:

                  tvg_id = tvg_id.strip()


                  if tvg_id in epg_ids:

                      return tvg_id


              # ----------------------------------------------
              # Exact normalized name
              # ----------------------------------------------

              normalized = normalize(
                  channel_name
              )


              if normalized:

                  if normalized in epg_names:

                      return epg_names[
                          normalized
                      ]


              # ----------------------------------------------
              # Partial name
              # ----------------------------------------------

              if normalized:

                  for name, cid in epg_names.items():

                      if (
                          normalized in name
                          or
                          name in normalized
                      ):

                          return cid


              return None


          # ==================================================
          # Process M3U
          # ==================================================

          lines = m3u.splitlines()


          output = []


          total = 0
          matched = 0


          for line in lines:


              if not line.startswith(
                  "#EXTINF"
              ):

                  output.append(
                      line
                  )

                  continue


              total += 1


              # ----------------------------------------------
              # Existing tvg-id
              # ----------------------------------------------

              match = re.search(
                  r'tvg-id="([^"]*)"',
                  line,
                  re.I
              )


              existing_tvg_id = (
                  match.group(1).strip()
                  if match
                  else ""
              )


              # ----------------------------------------------
              # Channel name
              # ----------------------------------------------

              if "," in line:

                  channel_name = (
                      line.split(
                          ",",
                          1
                      )[1].strip()
                  )

              else:

                  channel_name = ""


              # ----------------------------------------------
              # Find EPG
              # ----------------------------------------------

              epg_id = find_epg_id(
                  existing_tvg_id,
                  channel_name
              )


              if epg_id:

                  matched += 1


                  if match:

                      line = re.sub(
                          r'tvg-id="[^"]*"',
                          f'tvg-id="{epg_id}"',
                          line,
                          count=1
                      )

                  else:

                      line = line.replace(
                          "#EXTINF:",
                          f'#EXTINF: tvg-id="{epg_id}"',
                          1
                      )


              output.append(
                  line
              )


          # ==================================================
          # Write output
          # ==================================================

          OUTPUT.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )


          print("")
          print("=" * 70)
          print("FINAL RESULT")
          print("=" * 70)


          print(
              "Total channels:",
              total
          )


          print(
              "EPG matched:",
              matched
          )


          print(
              "EPG unmatched:",
              total - matched
          )


          percentage = (
              matched / total * 100
              if total
              else 0
          )


          print(
              "Match:",
              round(
                  percentage,
                  2
              ),
              "%"
          )


          print(
              "Output:",
              OUTPUT
          )


          PY


          python merge_epg.py


      # ================================================
      # Validate output
      # ================================================

      - name: Validate M3U
        run: |

          test -s fast-all-regions-epg.m3u


          echo ""
          echo "======================================"
          echo "M3U VALID"
          echo "======================================"


          wc -l fast-all-regions-epg.m3u


          grep -c "^#EXTINF" \
            fast-all-regions-epg.m3u


      # ================================================
      # Upload artifact
      # ================================================

      - name: Upload final M3U
        uses: actions/upload-artifact@v4

        with:
          name: final-m3u
          path: fast-all-regions-epg.m3u
          if-no-files-found: error


      # ================================================
      # Publish to repository
      # ================================================

      - name: Publish M3U
        run: |

          mkdir -p public

          cp \
            fast-all-regions-epg.m3u \
            public/fast-all-regions-epg.m3u


          git config user.name \
            "github-actions[bot]"


          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add public/fast-all-regions-epg.m3u


          if git diff --cached --quiet; then

            echo "No changes."

          else

            git commit \
              -m "Update merged M3U"

            git push

          fi
