name: Build Final M3U

on:
  workflow_run:
    workflows:
      - "Generate Optimized EPG"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: build-final-m3u
  cancel-in-progress: false

jobs:
  merge:

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.name == 'Generate Optimized EPG'
      )

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout latest main
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==================================================
      # 2. Setup Python
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==================================================
      # 3. Download latest EPG artifact
      # ==================================================

      - name: Download EPG artifact
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          mkdir -p epg_download

          gh run download \
            "${{ github.event.workflow_run.id }}" \
            --repo "${{ github.repository }}" \
            --name epg-xml \
            --dir epg_download

          echo ""
          echo "EPG files:"
          find epg_download -type f -ls


      # ==================================================
      # 4. Manual run support
      # ==================================================

      - name: Find EPG
        run: |

          if [ "${{ github.event_name }}" = "workflow_run" ]; then

            EPG_FILE=$(find epg_download \
              -type f \
              -name "*.xml" \
              | head -n 1)

          else

            EPG_FILE="public/epg.xml"

          fi


          if [ -z "$EPG_FILE" ] || [ ! -f "$EPG_FILE" ]; then

            echo "ERROR: EPG XML not found"

            exit 1

          fi


          echo "EPG_FILE=$EPG_FILE" >> "$GITHUB_ENV"

          echo "Using EPG:"
          echo "$EPG_FILE"


      # ==================================================
      # 5. Install dependencies
      # ==================================================

      - name: Install dependencies
        run: |

          python -m pip install \
            --upgrade pip

          pip install requests


      # ==================================================
      # 6. Create merge script
      # ==================================================

      - name: Create merge script
        run: |

          cat > merge_epg.py <<'PY'

          import gzip
          import re
          import requests
          import xml.etree.ElementTree as ET

          from pathlib import Path


          M3U_URL = (
              "https://raw.githubusercontent.com/"
              "Faridcj/fast-all-regions/main/"
              "fast-all-regions.m3u"
          )


          EPG_FILE = Path(
              __import__("os").environ["EPG_FILE"]
          )


          OUTPUT = Path(
              "fast-all-regions-epg.m3u"
          )


          def normalize(text):

              if not text:
                  return ""

              text = text.lower()

              text = re.sub(
                  r"[\s_\-\.]+",
                  "",
                  text
              )

              text = re.sub(
                  r"[^a-z0-9]+",
                  "",
                  text
              )

              return text


          def load_epg(path):

              print(
                  "Loading EPG:",
                  path
              )

              data = path.read_bytes()


              if data[:2] == b"\x1f\x8b":

                  print(
                      "EPG is gzip compressed"
                  )

                  data = gzip.decompress(
                      data
                  )


              root = ET.fromstring(
                  data
              )


              epg = {}


              for channel in root.findall(
                  ".//channel"
              ):

                  channel_id = channel.get(
                      "id"
                  )

                  if not channel_id:
                      continue


                  for name in channel.findall(
                      "display-name"
                  ):

                      if not name.text:
                          continue


                      normalized = normalize(
                          name.text
                      )


                      if normalized:

                          epg[
                              normalized
                          ] = channel_id


              return epg


          def find_epg_id(
              channel_name,
              epg
          ):

              normalized_name = normalize(
                  channel_name
              )


              if not normalized_name:
                  return None


              if normalized_name in epg:

                  return epg[
                      normalized_name
                  ]


              for epg_name, epg_id in epg.items():

                  if (
                      normalized_name in epg_name
                      or
                      epg_name in normalized_name
                  ):

                      return epg_id


              return None


          # ==================================================
          # Download current M3U
          # ==================================================

          print("")
          print("=" * 70)
          print("DOWNLOADING CURRENT M3U")
          print("=" * 70)


          response = requests.get(
              M3U_URL,
              timeout=120
          )


          response.raise_for_status()


          m3u = response.text


          print(
              "M3U characters:",
              len(m3u)
          )


          # ==================================================
          # Load EPG
          # ==================================================

          epg = load_epg(
              EPG_FILE
          )


          print(
              "EPG names:",
              len(epg)
          )


          # ==================================================
          # Merge
          # ==================================================

          lines = m3u.splitlines()

          output = []

          total_channels = 0
          matched_channels = 0


          for line in lines:

              if line.startswith(
                  "#EXTINF"
              ):

                  total_channels += 1


                  if "," in line:

                      channel_name = (
                          line.split(
                              ",",
                              1
                          )[1].strip()
                      )

                  else:

                      channel_name = ""


                  epg_id = find_epg_id(
                      channel_name,
                      epg
                  )


                  if epg_id:

                      if 'tvg-id="' in line:

                          line = re.sub(
                              r'tvg-id="[^"]*"',
                              f'tvg-id="{epg_id}"',
                              line
                          )

                      else:

                          line = line.replace(
                              "#EXTINF:",
                              f'#EXTINF: tvg-id="{epg_id}"',
                              1
                          )


                      matched_channels += 1


                  output.append(line)

              else:

                  output.append(line)


          # ==================================================
          # Write
          # ==================================================

          OUTPUT.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )


          print("")
          print("=" * 70)
          print("FINAL RESULT")
          print("=" * 70)

          print(
              "Total channels:",
              total_channels
          )

          print(
              "EPG matched:",
              matched_channels
          )

          print(
              "EPG unmatched:",
              total_channels -
              matched_channels
          )

          if total_channels:

              match_percent = (
                  matched_channels
                  /
                  total_channels
                  *
                  100
              )

              print(
                  "Match:",
                  f"{match_percent:.2f}%"
              )


          print(
              "Output:",
              OUTPUT
          )

          PY


      # ==================================================
      # 7. Run merge
      # ==================================================

      - name: Run merge
        run: |

          python merge_epg.py


      # ==================================================
      # 8. Publish final M3U
      # ==================================================

      - name: Publish final M3U
        run: |

          mkdir -p public

          cp \
            fast-all-regions-epg.m3u \
            public/fast-all-regions-epg.m3u


          echo ""
          echo "======================================"
          echo "FINAL M3U"
          echo "======================================"


          ls -lh \
            fast-all-regions-epg.m3u

          ls -lh \
            public/fast-all-regions-epg.m3u


          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            public/fast-all-regions-epg.m3u


          if git diff --cached --quiet; then

            echo "No final M3U changes."

          else

            git commit \
              -m "Update combined EPG playlist"

            git fetch origin main

            git rebase origin/main

            git push origin HEAD:main

          fi


      # ==================================================
      # 9. Upload final M3U artifact
      # ==================================================

      - name: Upload final M3U
        uses: actions/upload-artifact@v4

        with:
          name: final-m3u
          path: fast-all-regions-epg.m3u
          if-no-files-found: error
